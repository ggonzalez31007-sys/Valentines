<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine 💖</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f6b7d2;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .container {
    background: white;
    border: 8px solid #ff69b4;
    padding: 20px;
    display: flex;
    gap: 30px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(10, 40px);
    grid-template-rows: repeat(10, 40px);
    gap: 2px;
    background: white;
  }

  .cell {
    width: 40px;
    height: 40px;
    border: 1px solid #ddd;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    user-select: none;
    font-weight: bold;
  }

  .cell.active {
    background: pink;
  }

  .cell.found {
    background: #ffb6c1;
  }

  .right {
    width: 260px;
    position: relative;
  }

  #dialogue {
    font-size: 18px;
    min-height: 80px;
  }

  #finalSentence {
    margin-top: 20px;
    font-size: 22px;
    font-weight: bold;
  }

  .buttons {
    margin-top: 20px;
  }

  button {
    font-size: 18px;
    padding: 10px 20px;
    margin-right: 10px;
    cursor: pointer;
  }

  #yes, #no {
    display: none;
  }
</style>
</head>
<body>

<div class="container">
  <div class="grid" id="grid"></div>

  <div class="right">
    <div id="dialogue"></div>
    <div id="finalSentence"></div>
    <div class="buttons">
      <button id="yes">Yes</button>
      <button id="no">No</button>
    </div>
  </div>
</div>

<script>
/* =========================
   WORD SEARCH SETUP
========================= */
const WORDS = [
  "WILL",
  "YOU",
  "BE",
  "MY",
  "VALENTINE"
];

const SIZE = 10;
const gridEl = document.getElementById("grid");
let grid = [];
let selected = [];
let foundWords = new Set();

/* =========================
   GRID GENERATION
========================= */
function emptyGrid() {
  return Array.from({ length: SIZE }, () =>
    Array.from({ length: SIZE }, () => "")
  );
}

function placeWord(word) {
  const dirs = [
    [1,0], [0,1], [1,1]
  ];

  while (true) {
    const [dx, dy] = dirs[Math.floor(Math.random() * dirs.length)];
    const x = Math.floor(Math.random() * SIZE);
    const y = Math.floor(Math.random() * SIZE);

    if (
      x + dx * word.length >= SIZE ||
      y + dy * word.length >= SIZE
    ) continue;

    let fits = true;
    for (let i = 0; i < word.length; i++) {
      const c = grid[y + dy*i][x + dx*i];
      if (c && c !== word[i]) fits = false;
    }
    if (!fits) continue;

    for (let i = 0; i < word.length; i++) {
      grid[y + dy*i][x + dx*i] = word[i];
    }
    break;
  }
}

function fillGrid() {
  grid = emptyGrid();
  WORDS.forEach(placeWord);

  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      if (!grid[y][x]) {
        grid[y][x] = String.fromCharCode(65 + Math.random() * 26);
      }
    }
  }
}

function drawGrid() {
  gridEl.innerHTML = "";
  grid.flat().forEach(letter => {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.textContent = letter;
    cell.addEventListener("mousedown", () => select(cell));
    gridEl.appendChild(cell);
  });
}

fillGrid();
drawGrid();

/* =========================
   SELECTION LOGIC
========================= */
function select(cell) {
  if (selected.includes(cell)) return;
  cell.classList.add("active");
  selected.push(cell);

  const word = selected.map(c => c.textContent).join("");
  if (WORDS.includes(word) && !foundWords.has(word)) {
    foundWords.add(word);
    selected.forEach(c => {
      c.classList.remove("active");
      c.classList.add("found");
    });
    selected = [];
    if (foundWords.size === WORDS.length) startEndSequence();
  }
}

document.addEventListener("mouseup", () => {
  selected.forEach(c => c.classList.remove("active"));
  selected = [];
});

/* =========================
   END SEQUENCE
========================= */
const dialogue = document.getElementById("dialogue");
const sentence = document.getElementById("finalSentence");
const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");

function startEndSequence() {
  dialogue.textContent = "Congratulations Baby! 💖";

  setTimeout(() => dialogue.textContent = "You found all the words!", 5000);
  setTimeout(() => dialogue.textContent = "Now to complete this you have one last thing to do!", 10000);
  setTimeout(animateLetters, 15000);
}

/* =========================
   LETTER ANIMATION
========================= */
function animateLetters() {
  const phrase = "WILL YOU BE MY VALENTINE";
  sentence.textContent = phrase;

  const target = sentence.getBoundingClientRect();
  let cursorX = target.left;

  document.querySelectorAll(".cell.found").forEach(cell => {
    const rect = cell.getBoundingClientRect();
    const clone = cell.cloneNode(true);
    clone.style.position = "fixed";
    clone.style.left = rect.left + "px";
    clone.style.top = rect.top + "px";
    clone.style.transition = "transform 1.2s ease";
    clone.style.zIndex = 999;
    document.body.appendChild(clone);

    requestAnimationFrame(() => {
      clone.style.transform = `translate(${cursorX - rect.left}px, ${target.top - rect.top}px)`;
    });

    cursorX += 22;
    setTimeout(() => clone.remove(), 1300);
  });

  setTimeout(showButtons, 1400);
}

/* =========================
   YES / NO
========================= */
function showButtons() {
  yesBtn.style.display = "inline-block";
  noBtn.style.display = "inline-block";
}

noBtn.addEventListener("mouseenter", () => {
  noBtn.style.position = "fixed";
  noBtn.style.left = Math.random() * (window.innerWidth - 100) + "px";
  noBtn.style.top = Math.random() * (window.innerHeight - 40) + "px";
});

yesBtn.addEventListener("click", () => {
  yesBtn.style.display = "none";
  noBtn.style.display = "none";

  dialogue.textContent = "AWESOME! Now you get to claim your gifts :)";
  setTimeout(() => dialogue.textContent = "Go outside!! 💕", 5000);
});
</script>

</body>
</html>
