<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Leslie's Valentine's Game 💖</title>

<style>
  body {
    margin: 0;
    background: #ffc0cb;
    font-family: Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
  }

  h1 {
    color: #8b0000;
    text-align: center;
    margin-top: 20px;
  }

  #game {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 30px;
    margin-top: 30px;
  }

  #grid-wrapper {
    background: white;
    padding: 16px;
    border-radius: 20px;
    box-shadow: 0 0 20px rgba(255,105,180,0.5);
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(10, 42px);
    grid-template-rows: repeat(10, 42px);
    gap: 4px;
    background: #ff69b4;
    padding: 10px;
    border-radius: 14px;
  }

  .cell {
    width: 42px;
    height: 42px;
    background: white;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
    color: #8b0000;
    cursor: pointer;
    user-select: none;
  }

  .cell.active {
    background: #ffb6c1;
  }

  .cell.found {
    background: #ff69b4;
    color: white;
  }

  #side {
    width: 300px;
    min-height: 300px;
    color: #8b0000;
    font-size: 20px;
  }

  #question {
    display: none;
    margin-top: 20px;
  }

  button {
    padding: 12px 22px;
    font-size: 18px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: #ff69b4;
    color: white;
    margin: 10px 10px 0 0;
  }

  canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }
</style>
</head>

<body>

<h1>💗 Find the hidden words 💗</h1>

<div id="game">
  <div id="grid-wrapper">
    <div id="grid"></div>
  </div>

  <div id="side">
    <div id="message">Find all the words 💕</div>

    <div id="question">
      <p>Will you be my valentine?</p>
      <button id="yes">Yes</button>
      <button id="no">No</button>
    </div>
  </div>
</div>

<canvas id="confetti"></canvas>

<script>
/* ======================
   CONFIG
====================== */

const GRID_SIZE = 10;
const WORDS = ["WILL", "YOU", "BE", "MY", "VALENTINE"];
const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

const directions = [
  [1, 0],   // horizontal
  [0, 1],   // vertical
  [1, 1]    // diagonal
];

const grid = document.getElementById("grid");
const message = document.getElementById("message");
const question = document.getElementById("question");

let gridData = Array.from({ length: GRID_SIZE }, () =>
  Array(GRID_SIZE).fill("")
);

let foundWords = new Set();

/* ======================
   WORD PLACEMENT
====================== */

function placeWord(word) {
  for (let attempt = 0; attempt < 100; attempt++) {
    const [dx, dy] = directions[Math.floor(Math.random() * directions.length)];
    const row = Math.floor(Math.random() * GRID_SIZE);
    const col = Math.floor(Math.random() * GRID_SIZE);

    const endRow = row + dy * (word.length - 1);
    const endCol = col + dx * (word.length - 1);

    if (endRow < 0 || endRow >= GRID_SIZE || endCol < 0 || endCol >= GRID_SIZE)
      continue;

    let fits = true;
    for (let i = 0; i < word.length; i++) {
      const r = row + dy * i;
      const c = col + dx * i;
      if (gridData[r][c] && gridData[r][c] !== word[i]) {
        fits = false;
        break;
      }
    }

    if (!fits) continue;

    for (let i = 0; i < word.length; i++) {
      gridData[row + dy * i][col + dx * i] = word[i];
    }
    return;
  }
}

WORDS.forEach(placeWord);

for (let r = 0; r < GRID_SIZE; r++) {
  for (let c = 0; c < GRID_SIZE; c++) {
    if (!gridData[r][c]) {
      gridData[r][c] = letters[Math.floor(Math.random() * letters.length)];
    }
  }
}

/* ======================
   RENDER GRID
====================== */

gridData.flat().forEach(letter => {
  const cell = document.createElement("div");
  cell.className = "cell";
  cell.textContent = letter;
  grid.appendChild(cell);
});

/* ======================
   SELECTION LOGIC
====================== */

let selecting = false;
let selected = [];

grid.addEventListener("mousedown", e => {
  if (!e.target.classList.contains("cell")) return;
  selecting = true;
  selected = [];
  select(e.target);
});

grid.addEventListener("mouseover", e => {
  if (!selecting || !e.target.classList.contains("cell")) return;
  select(e.target);
});

document.addEventListener("mouseup", () => {
  if (!selecting) return;
  selecting = false;
  checkWord();
});

function select(cell) {
  if (selected.includes(cell)) return;
  cell.classList.add("active");
  selected.push(cell);
}

function clearSelection() {
  selected.forEach(c => c.classList.remove("active"));
  selected = [];
}

function checkWord() {
  const word = selected.map(c => c.textContent).join("");
  if (WORDS.includes(word) && !foundWords.has(word)) {
    selected.forEach(c => {
      c.classList.remove("active");
      c.classList.add("found");
    });
    foundWords.add(word);
    burstConfetti();
    message.textContent = `Found: ${word} 💖`;

    if (foundWords.size === WORDS.length) finishGame();
  } else {
    clearSelection();
  }
}

/* ======================
   END DIALOGUE (7s STEPS)
====================== */

function finishGame() {
  const lines = [
    "Congratulations Baby! 💕",
    "You found all the words!",
    "Now to complete this you have one last thing to do!"
  ];

  let index = 0;
  message.textContent = "";

  const interval = setInterval(() => {
    message.textContent = lines[index];
    index++;

    if (index === lines.length) {
      clearInterval(interval);
      setTimeout(() => {
        question.style.display = "block";
        startConfetti();
      }, 7000);
    }
  }, 7000);
}

/* ======================
   YES / NO
====================== */

document.getElementById("no").addEventListener("mouseenter", moveNo);
document.getElementById("no").addEventListener("click", moveNo);

function moveNo() {
  const btn = document.getElementById("no");
  btn.style.position = "absolute";
  btn.style.left = Math.random() * (window.innerWidth - 120) + "px";
  btn.style.top = Math.random() * (window.innerHeight - 60) + "px";
}

document.getElementById("yes").addEventListener("click", () => {
  question.style.display = "none";
  message.innerHTML = `
    AWESOME! Now you get to claim your gifts :)<br>
    Go outside!!
  `;
});

/* ======================
   CONFETTI
====================== */

const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let confetti = [];

function burstConfetti() {
  for (let i = 0; i < 30; i++) {
    confetti.push({
      x: Math.random() * canvas.width,
      y: 0,
      r: Math.random() * 6 + 4,
      d: Math.random() * 4 + 2,
      color: Math.random() > 0.5 ? "#ffc0cb" : "#ffffff"
    });
  }
}

function startConfetti() {
  burstConfetti();
}

function drawConfetti() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  confetti.forEach((c, i) => {
    ctx.beginPath();
    ctx.fillStyle = c.color;
    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctx.fill();
    c.y += c.d;
    if (c.y > canvas.height) confetti.splice(i, 1);
  });
  requestAnimationFrame(drawConfetti);
}

drawConfetti();
</script>

</body>
</html>
