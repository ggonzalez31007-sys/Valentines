<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Valentine 💕</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f8b6c8;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  #game {
    display: flex;
    gap: 30px;
    background: white;
    border: 12px solid hotpink;
    padding: 20px;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(10, 40px);
    grid-template-rows: repeat(10, 40px);
    gap: 4px;
  }

  .cell {
    width: 40px;
    height: 40px;
    background: white;
    border: 1px solid #ccc;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
  }

  .cell.active { background: pink; }
  .cell.found  { background: #ff8fb1; color: white; }

  #side {
    width: 260px;
    position: relative;
  }

  #message {
    font-size: 18px;
    min-height: 80px;
  }

  #question {
    display: none;
    margin-top: 20px;
    text-align: center;
  }

  #sentence {
    font-size: 22px;
    margin-bottom: 15px;
    min-height: 30px;
  }

  button {
    padding: 10px 20px;
    font-size: 16px;
    margin: 5px;
    cursor: pointer;
  }

  #confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .confetti {
    position: absolute;
    width: 8px;
    height: 8px;
    background: pink;
    animation: fall 4s linear infinite;
  }

  @keyframes fall {
    from { transform: translateY(-10px); }
    to   { transform: translateY(100vh); }
  }

  .fly-letter {
    position: fixed;
    font-weight: bold;
    font-size: 22px;
    transition: all 1.2s ease-in-out;
    z-index: 999;
  }
</style>
</head>
<body>

<div id="game">
  <div id="grid"></div>
  <div id="side">
    <div id="message"></div>
    <div id="question">
      <div id="sentence"></div>
      <button id="yes">Yes</button>
      <button id="no">No</button>
    </div>
  </div>
</div>

<div id="confetti"></div>

<script>
const WORDS = ["WILL","YOU","BE","MY","VALENTINE"];
const PHRASE = "WILL YOU BE MY VALENTINE";
const grid = document.getElementById("grid");
const message = document.getElementById("message");
const question = document.getElementById("question");
const sentenceEl = document.getElementById("sentence");
const confetti = document.getElementById("confetti");

const size = 10;
let cells = [];
let selected = [];
let foundWords = new Set();

function randomLetter() {
  return "ABCDEFGHIJKLMNOPQRSTUVWXYZ"[Math.floor(Math.random()*26)];
}

function createGrid() {
  for (let i = 0; i < size * size; i++) {
    const div = document.createElement("div");
    div.className = "cell";
    div.textContent = randomLetter();
    div.addEventListener("mousedown", () => start(div));
    div.addEventListener("mouseenter", () => drag(div));
    div.addEventListener("mouseup", end);
    grid.appendChild(div);
    cells.push(div);
  }
}

function placeWords() {
  let index = 0;
  WORDS.forEach(word => {
    let placed = false;
    while (!placed) {
      const dir = [[1,0],[0,1],[1,1]][Math.floor(Math.random()*3)];
      const row = Math.floor(Math.random()*size);
      const col = Math.floor(Math.random()*size);
      let fits = true;
      for (let i = 0; i < word.length; i++) {
        const r = row + dir[1]*i;
        const c = col + dir[0]*i;
        if (r >= size || c >= size) fits = false;
      }
      if (!fits) continue;
      for (let i = 0; i < word.length; i++) {
        const r = row + dir[1]*i;
        const c = col + dir[0]*i;
        cells[r*size+c].textContent = word[i];
      }
      placed = true;
    }
  });
}

function start(cell) {
  clearSelection();
  select(cell);
}

function drag(cell) {
  if (selected.length) select(cell);
}

function end() {
  const word = selected.map(c => c.textContent).join("");
  if (WORDS.includes(word) && !foundWords.has(word)) {
    foundWords.add(word);
    selected.forEach(c => c.classList.add("found"));
    launchConfetti();
    if (foundWords.size === WORDS.length) finishGame();
  }
  clearSelection();
}

function select(cell) {
  if (!selected.includes(cell)) {
    cell.classList.add("active");
    selected.push(cell);
  }
}

function clearSelection() {
  selected.forEach(c => c.classList.remove("active"));
  selected = [];
}

function launchConfetti() {
  for (let i = 0; i < 25; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random()*100 + "vw";
    c.style.animationDelay = Math.random()*2 + "s";
    confetti.appendChild(c);
    setTimeout(()=>c.remove(),4000);
  }
}

function finishGame() {
  message.textContent = "Congratulations Baby! 💕";

  setTimeout(()=>message.textContent="You found all the words!",7000);
  setTimeout(()=>message.textContent="Now to complete this you have one last thing to do!",14000);
  setTimeout(animatePhrase,21000);
}

function animatePhrase() {
  const rect = sentenceEl.getBoundingClientRect();
  sentenceEl.textContent = PHRASE;

  const letters = PHRASE.replace(/ /g,"").split("");
  let i = 0;

  cells.forEach(cell=>{
    if (letters.includes(cell.textContent) && i < letters.length) {
      const clone = document.createElement("div");
      const r = cell.getBoundingClientRect();
      clone.textContent = cell.textContent;
      clone.className = "fly-letter";
      clone.style.left = r.left + "px";
      clone.style.top = r.top + "px";
      document.body.appendChild(clone);

      setTimeout(()=>{
        clone.style.left = rect.left + 20 + i*14 + "px";
        clone.style.top = rect.top + "px";
      },50);

      setTimeout(()=>clone.remove(),1500);
      i++;
    }
  });

  setTimeout(()=>question.style.display="block",1500);
}

const noBtn = document.getElementById("no");
noBtn.addEventListener("mouseenter",()=>{
  const x = Math.random()*(window.innerWidth-noBtn.offsetWidth-20);
  const y = Math.random()*(window.innerHeight-noBtn.offsetHeight-20);
  noBtn.style.position="fixed";
  noBtn.style.left=x+"px";
  noBtn.style.top=y+"px";
});

document.getElementById("yes").onclick=()=>{
  sentenceEl.textContent="AWESOME! Now you get to claim your gifts :)";
  noBtn.style.display="none";
};

createGrid();
placeWords();
</script>
</body>
</html>
