<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine Sanrio Platformer</title>

  <!-- Phaser 3 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

  <style>
    body {
      margin: 0;
      background-color: #ffc0cb; /* soft Valentine pink background */
      font-family: 'Comic Sans MS', cursive, sans-serif;
    }

    canvas {
      display: block;
      margin: 0 auto;
      border: 4px solid #ff69b4; /* optional cute border around canvas */
      box-shadow: 0 0 20px #ffb6c1;
    }
  </style>
</head>
<body>
  <!-- Optional start screen container (Phaser will draw over this) -->
  <div id="game-container"></div>

  <!-- Load your main game script -->
  <script src="main.js"></script>
</body>
</html>
