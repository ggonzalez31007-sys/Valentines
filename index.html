<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Sanrio Platformer 💗</title>

    <!-- Phaser 3 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>

    <style>
        body {
            margin: 0;
            background: #ffd6e7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: "Arial Rounded MT Bold", Arial, sans-serif;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
        }

        canvas {
            border: 8px solid #ff9fbf;
            box-shadow: 0 0 20px rgba(255, 160, 190, 0.8);
            display: block;
        }

        /* MENU OVERLAY */
        #menu {
            position: absolute;
            width: 800px;
            height: 600px;
            top: 0;
            left: 0;
            background: rgba(255, 214, 231, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #menu-box {
            background: #ffa4b8; /* salmon pink */
            border-radius: 20px;
            padding: 32px 44px;
            color: white;
            font-size: 24px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="menu">
        <div id="menu-box">
            💕 Hey Gorgeous! 💕<br><br>
            Press <b>Enter</b> To Start!
        </div>
    </div>
</div>

<!-- GAME CODE -->
<script src="main.js"></script>

<script>
    // ENTER TO START
    window.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            const menu = document.getElementById("menu");
            if (menu) {
                menu.style.display = "none";
            }
        }
    });
</script>

</body>
</html>
