<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sanrio Platformer</title>
    <style>
        body {
            margin: 0;
            background: #ffb6c1;
            overflow: hidden;
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }

        #startScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,182,193,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #startScreenBox {
            background: #ffa07a;
            padding: 40px 60px;
            border-radius: 20px;
            text-align: center;
            font-size: 32px;
            color: white;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        canvas {
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div id="startScreen">
        <div id="startScreenBox">Hey Gorgeous!<br>Press Enter To Start!</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.js"></script>
    <script src="main.js"></script>

    <script>
        const startScreen = document.getElementById('startScreen');
        window.addEventListener('keydown', function(event) {
            if(event.code === 'Enter') {
                startScreen.remove();
            }
        });
    </script>
</body>
</html>
