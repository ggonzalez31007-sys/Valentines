<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Leslie's Valentine's Game</title>
<style>
  body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background-color: #ffc0cb; /* soft pink */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    height: 100vh;
    overflow: hidden;
  }

  #game-container {
    margin-top: 50px;
    position: relative;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(25, 30px);
    grid-template-rows: repeat(1, 30px);
    gap: 2px;
  }

  .cell {
    width: 30px;
    height: 30px;
    background-color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    user-select: none;
    cursor: pointer;
    border-radius: 4px;
  }

  .cell.selected {
    background-color: #ffb6c1; /* pink highlight */
  }

  #messages {
    margin-top: 20px;
    text-align: center;
    font-size: 1.5rem;
    color: #800000;
    min-height: 100px;
  }

  #final-question {
    margin-top: 20px;
    display: none;
    text-align: center;
  }

  #final-question button {
    margin: 10px;
    padding: 10px 20px;
    font-size: 1.2rem;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background-color: #ff69b4;
    color: white;
    transition: all 0.2s;
  }

  #final-question button:hover {
    transform: scale(1.1);
  }

  canvas {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="game-container">
  <div class="grid" id="grid"></div>
  <canvas id="confetti"></canvas>
</div>
<div id="messages"></div>
<div id="final-question">
  <p>Will you be my valentine?</p>
  <button id="yes-btn">Yes</button>
  <button id="no-btn">No</button>
</div>

<script>
const phrase = "WILL YOU BE MY VALENTINE".replace(/\s/g,''); // remove spaces
const grid = document.getElementById('grid');
const messagesDiv = document.getElementById('messages');
const finalQuestion = document.getElementById('final-question');
const yesBtn = document.getElementById('yes-btn');
const noBtn = document.getElementById('no-btn');
const confettiCanvas = document.getElementById('confetti');
const ctx = confettiCanvas.getContext('2d');
confettiCanvas.width = window.innerWidth;
confettiCanvas.height = window.innerHeight;

// Build grid (one row with each letter)
for (let i = 0; i < phrase.length; i++) {
  const cell = document.createElement('div');
  cell.classList.add('cell');
  cell.textContent = phrase[i];
  cell.dataset.index = i;
  grid.appendChild(cell);
}

let selectedIndices = [];

// Handle letter selection
grid.addEventListener('mousedown', startSelection);
grid.addEventListener('mouseover', continueSelection);
grid.addEventListener('mouseup', endSelection);

let isSelecting = false;

function startSelection(e) {
  if (!e.target.classList.contains('cell')) return;
  isSelecting = true;
  selectedIndices = [];
  grid.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
  selectCell(e.target);
}

function continueSelection(e) {
  if (!isSelecting) return;
  if (!e.target.classList.contains('cell')) return;
  selectCell(e.target);
}

function endSelection(e) {
  isSelecting = false;
  // check selection
  const selectedWord = selectedIndices.map(i => phrase[i]).join('');
  if (selectedWord === phrase) {
    showCompletion();
  }
}

function selectCell(cell) {
  const idx = parseInt(cell.dataset.index);
  if (!selectedIndices.includes(idx)) {
    selectedIndices.push(idx);
    cell.classList.add('selected');
  }
}

// Completion messages
function showCompletion() {
  let seq = [
    "Congratulations Baby!",
    "You found all the words!",
    "Now to complete this you have one last thing to do!"
  ];
  let i = 0;
  messagesDiv.textContent = "";
  const interval = setInterval(() => {
    messagesDiv.textContent = seq[i];
    i++;
    if (i >= seq.length) {
      clearInterval(interval);
      startConfetti();
      setTimeout(() => {
        finalQuestion.style.display = "block";
      }, 1000);
    }
  }, 1500);
}

// Yes / No button behavior
noBtn.addEventListener('mouseenter', moveNoButton);
noBtn.addEventListener('click', moveNoButton);

yesBtn.addEventListener('click', () => {
  messagesDiv.innerHTML = "AWESOME! Now you get to claim your gifts :)<br>Go outside!!";
  finalQuestion.style.display = "none";
});

function moveNoButton() {
  const maxX = window.innerWidth - noBtn.offsetWidth - 20;
  const maxY = window.innerHeight - noBtn.offsetHeight - 20;
  const x = Math.random() * maxX;
  const y = Math.random() * maxY;
  noBtn.style.position = 'absolute';
  noBtn.style.left = `${x}px`;
  noBtn.style.top = `${y}px`;
}

// Confetti effect
let confettis = [];
function startConfetti() {
  for (let i=0;i<150;i++){
    confettis.push({
      x: Math.random()*window.innerWidth,
      y: Math.random()*-window.innerHeight,
      r: Math.random()*6+4,
      d: Math.random()*10+2,
      color: Math.random()>0.5?'#ffc0cb':'#ffffff',
      tilt: Math.random()*10-10
    });
  }
  requestAnimationFrame(drawConfetti);
}

function drawConfetti() {
  ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
  confettis.forEach(c=>{
    ctx.beginPath();
    ctx.lineWidth = c.r/2;
    ctx.strokeStyle = c.color;
    ctx.moveTo(c.x + c.tilt + c.r/4, c.y);
    ctx.lineTo(c.x + c.tilt, c.y + c.r);
    ctx.stroke();
    c.y += (Math.cos(c.d)+3+c.r/2)/2;
    c.x += Math.sin(0);
    if(c.y>window.innerHeight){
      c.y = Math.random()*-20;
      c.x = Math.random()*window.innerWidth;
    }
  });
  requestAnimationFrame(drawConfetti);
}

// Adjust canvas on resize
window.addEventListener('resize', () => {
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
});
</script>
</body>
</html>
