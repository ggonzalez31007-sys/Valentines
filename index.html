<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Leslie's Valentine's Game 💖</title>

<style>
  body {
    margin: 0;
    background: #ffc0cb;
    font-family: Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
  }

  h1 {
    color: #8b0000;
    text-align: center;
    margin-top: 20px;
  }

  #game {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 30px;
    margin-top: 30px;
  }

  #grid-wrapper {
    background: white;
    padding: 16px;
    border-radius: 20px;
    box-shadow: 0 0 20px rgba(255,105,180,0.5);
    position: relative;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(10, 42px);
    grid-template-rows: repeat(10, 42px);
    gap: 4px;
    background: #ff69b4;
    padding: 10px;
    border-radius: 14px;
  }

  .cell {
    width: 42px;
    height: 42px;
    background: white;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
    color: #8b0000;
    cursor: pointer;
    user-select: none;
  }

  .cell.active { background: #ffb6c1; }
  .cell.found { background: #ff69b4; color: white; }

  #side {
    width: 340px;
    min-height: 300px;
    color: #8b0000;
    font-size: 22px;
  }

  #question {
    display: none;
    margin-top: 20px;
  }

  #valentine-text {
    position: relative;
    height: 48px;
    margin-bottom: 20px;
  }

  button {
    padding: 12px 22px;
    font-size: 18px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: #ff69b4;
    color: white;
    margin-right: 10px;
  }

  .flying-letter {
    position: fixed;
    font-size: 32px;
    font-weight: bold;
    color: #8b0000;
    transition: transform 1.2s ease-in-out;
    pointer-events: none;
    z-index: 999;
  }

  canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }
</style>
</head>

<body>

<h1>💗 Find the hidden words 💗</h1>

<div id="game">
  <div id="grid-wrapper">
    <div id="grid"></div>
  </div>

  <div id="side">
    <div id="message">Find all the words 💕</div>

    <div id="question">
      <div id="valentine-text"></div>
      <button id="yes">Yes</button>
      <button id="no">No</button>
    </div>
  </div>
</div>

<canvas id="confetti"></canvas>

<script>
const GRID_SIZE = 10;
const WORDS = ["WILL","YOU","BE","MY","VALENTINE"];
const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const directions = [[1,0],[0,1],[1,1]];

const grid = document.getElementById("grid");
const message = document.getElementById("message");
const question = document.getElementById("question");
const valentineText = document.getElementById("valentine-text");

let gridData = Array.from({length:GRID_SIZE},()=>Array(GRID_SIZE).fill(""));
let foundWords = new Set();

function placeWord(word){
  for(let t=0;t<100;t++){
    const [dx,dy]=directions[Math.floor(Math.random()*directions.length)];
    const r=Math.floor(Math.random()*GRID_SIZE);
    const c=Math.floor(Math.random()*GRID_SIZE);
    if(r+dy*(word.length-1)>=GRID_SIZE||c+dx*(word.length-1)>=GRID_SIZE)continue;
    let ok=true;
    for(let i=0;i<word.length;i++){
      const ch=gridData[r+dy*i][c+dx*i];
      if(ch&&ch!==word[i]) ok=false;
    }
    if(!ok)continue;
    for(let i=0;i<word.length;i++) gridData[r+dy*i][c+dx*i]=word[i];
    return;
  }
}

WORDS.forEach(placeWord);
for(let r=0;r<GRID_SIZE;r++)
  for(let c=0;c<GRID_SIZE;c++)
    if(!gridData[r][c])
      gridData[r][c]=letters[Math.floor(Math.random()*letters.length)];

gridData.flat().forEach(l=>{
  const d=document.createElement("div");
  d.className="cell";
  d.textContent=l;
  grid.appendChild(d);
});

let selecting=false, selected=[];
grid.addEventListener("mousedown",e=>{
  if(!e.target.classList.contains("cell"))return;
  selecting=true; selected=[]; pick(e.target);
});
grid.addEventListener("mouseover",e=>{
  if(selecting && e.target.classList.contains("cell")) pick(e.target);
});
document.addEventListener("mouseup",()=>{
  if(selecting){ selecting=false; check(); }
});

function pick(c){
  if(selected.includes(c))return;
  c.classList.add("active");
  selected.push(c);
}

function clearSel(){
  selected.forEach(c=>c.classList.remove("active"));
  selected=[];
}

function check(){
  const word=selected.map(c=>c.textContent).join("");
  if(WORDS.includes(word)&&!foundWords.has(word)){
    selected.forEach(c=>{
      c.classList.remove("active");
      c.classList.add("found");
    });
    foundWords.add(word);
    burstConfetti();
    if(foundWords.size===WORDS.length) finishGame();
  } else clearSel();
}

function finishGame(){
  message.textContent="Congratulations Baby! 💕";
  setTimeout(()=>message.textContent="You found all the words!",5000);
  setTimeout(()=>message.textContent="Now to complete this you have one last thing to do!",10000);
  setTimeout(()=>{
    question.style.display="block";
    animateSentence();
  },15000);
}

/* ⭐ LETTER FLY WITH PROPORTIONAL FINAL SPACING ⭐ */
function animateSentence(){
  const sentence = "WILL YOU BE MY VALENTINE";
  const foundCells = [...document.querySelectorAll(".cell.found")];
  const used = new Set();
  const targetRect = valentineText.getBoundingClientRect();

  let cursorX = 0; 
  const wordSpacing = 14;

  // Adjusted letter spacing: final visual look based on your screenshot
  const letterSpacingMap = {
    "WILL":[32,26,25,25],        // LL slightly closer to WI
    "YOU":[28,28,28],
    "BE":[28,28],
    "MY":[28,28],
    "VALENTINE":[26,26,26,26,26,26,26,22,22] // NE much closer to VALENTI
  };

  sentence.split(" ").forEach(word=>{
    const spacings = letterSpacingMap[word];
    word.split("").forEach((char,idx)=>{
      const source = foundCells.find(c=>c.textContent===char && !used.has(c));
      if(!source) return;
      used.add(source);
      const start = source.getBoundingClientRect();
      const letter = document.createElement("div");
      letter.className = "flying-letter";
      letter.textContent = char;
      letter.style.left = start.left+"px";
      letter.style.top = start.top+"px";
      document.body.appendChild(letter);

      const finalX = targetRect.left + cursorX;
      const finalY = targetRect.top;

      requestAnimationFrame(()=>{
        letter.style.transform =
          `translate(${finalX-start.left}px, ${finalY-start.top}px)`;
      });

      cursorX += spacings[idx];
    });
    cursorX += wordSpacing; 
  });
}

/* YES / NO */
const noBtn=document.getElementById("no");
noBtn.addEventListener("mouseenter",()=>{
  noBtn.style.position="fixed";
  noBtn.style.left=Math.random()*(innerWidth-120)+"px";
  noBtn.style.top=Math.random()*(innerHeight-60)+"px";
});

document.getElementById("yes").addEventListener("click",()=>{
  question.style.display="none";
  message.textContent="AWESOME! Now you get to claim your gifts :)";
  setTimeout(()=>message.textContent="Go outside!! 💕",5000);
});

/* CONFETTI */
const canvas=document.getElementById("confetti");
const ctx=canvas.getContext("2d");
canvas.width=innerWidth; canvas.height=innerHeight;
let confetti=[];
function burstConfetti(){
  for(let i=0;i<40;i++)
    confetti.push({x:Math.random()*canvas.width,y:0,r:4+Math.random()*4,d:2+Math.random()*4,c:Math.random()>0.5?"#ffc0cb":"#fff"});
}
(function loop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  confetti.forEach((c,i)=>{
    ctx.fillStyle=c.c;
    ctx.beginPath();
    ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
    ctx.fill();
    c.y+=c.d;
    if(c.y>canvas.height) confetti.splice(i,1);
  });
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
