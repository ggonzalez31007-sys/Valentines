<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sanrio Platformer</title>
    <style>
        body {
            margin: 0;
            background: #ffb6c1; /* pink fallback */
            font-family: 'Comic Sans MS', cursive, sans-serif;
            overflow: hidden;
        }

        /* Start screen overlay */
        #startScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 182, 193, 0.6); /* semi-transparent pink overlay */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        /* Salmon pink box */
        #startScreenBox {
            background: #ffa07a; /* cute salmon pink */
            padding: 40px 60px;
            border-radius: 20px;
            text-align: center;
            font-size: 32px;
            color: white; /* white letters */
            font-weight: bold;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        canvas {
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <!-- Start Screen Overlay -->
    <div id="startScreen">
        <div id="startScreenBox">
            Hey Gorgeous!<br>Press Enter To Start!
        </div>
    </div>

    <!-- Phaser library -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.js"></script>

    <!-- Main game code -->
    <script src="main.js"></script>

    <script>
        // Start screen logic
        const startScreen = document.getElementById('startScreen');

        window.addEventListener('keydown', function(event) {
            if(event.code === 'Enter') {
                startScreen.remove(); // completely remove overlay
            }
        });
    </script>
</body>
</html>
