<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Leslie's Valentine's Game 💖</title>

<style>
  body {
    margin: 0;
    background: #ffc0cb;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  h1 {
    color: #8b0000;
    margin-top: 20px;
  }

  #grid-wrapper {
    background: white;
    padding: 16px;
    border-radius: 20px;
    box-shadow: 0 0 20px rgba(255,105,180,0.5);
    margin-top: 20px;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(10, 42px);
    grid-template-rows: repeat(10, 42px);
    gap: 4px;
    background: #ff69b4;
    padding: 10px;
    border-radius: 14px;
  }

  .cell {
    width: 42px;
    height: 42px;
    background: white;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
    color: #8b0000;
    cursor: pointer;
    user-select: none;
  }

  .cell.active {
    background: #ffb6c1;
  }

  #message {
    margin-top: 20px;
    font-size: 22px;
    color: #8b0000;
    min-height: 40px;
    text-align: center;
  }

  #question {
    display: none;
    text-align: center;
    margin-top: 20px;
  }

  #question p {
    font-size: 28px;
    color: #8b0000;
  }

  button {
    padding: 12px 22px;
    font-size: 18px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: #ff69b4;
    color: white;
    margin: 10px;
  }

  canvas {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
  }
</style>
</head>

<body>

<h1>💗 Find the hidden phrase 💗</h1>

<div id="grid-wrapper">
  <div id="grid"></div>
</div>

<div id="message"></div>

<div id="question">
  <p>Will you be my valentine?</p>
  <button id="yes">Yes</button>
  <button id="no">No</button>
</div>

<canvas id="confetti"></canvas>

<script>
/* ======================
   GRID SETUP
====================== */

const GRID_SIZE = 10;
const PHRASE = "WILLYOUBEMYVALENTINE"; // 19 letters
const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const grid = document.getElementById("grid");

let gridData = Array.from({ length: GRID_SIZE }, () =>
  Array(GRID_SIZE).fill("")
);

// Place phrase left → right across rows
function placePhrase() {
  let index = 0;

  for (let r = 0; r < GRID_SIZE && index < PHRASE.length; r++) {
    for (let c = 0; c < GRID_SIZE && index < PHRASE.length; c++) {
      gridData[r][c] = PHRASE[index];
      index++;
    }
  }
}

// Fill remaining cells safely
function fillGrid() {
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      if (gridData[r][c] === "") {
        gridData[r][c] = letters[Math.floor(Math.random() * letters.length)];
      }
    }
  }
}

// Render grid
function renderGrid() {
  grid.innerHTML = "";
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.textContent = gridData[r][c];
      grid.appendChild(cell);
    }
  }
}

placePhrase();
fillGrid();
renderGrid();

/* ======================
   SELECTION LOGIC
====================== */

let selecting = false;
let selected = [];

grid.addEventListener("mousedown", e => {
  if (!e.target.classList.contains("cell")) return;
  selecting = true;
  clearSelection();
  selectCell(e.target);
});

grid.addEventListener("mouseover", e => {
  if (!selecting || !e.target.classList.contains("cell")) return;
  selectCell(e.target);
});

document.addEventListener("mouseup", () => {
  selecting = false;
  checkWord();
});

function selectCell(cell) {
  if (selected.includes(cell)) return;
  cell.classList.add("active");
  selected.push(cell);
}

function clearSelection() {
  selected.forEach(c => c.classList.remove("active"));
  selected = [];
}

function checkWord() {
  const word = selected.map(c => c.textContent).join("");
  if (word === PHRASE) completeGame();
  else clearSelection();
}

/* ======================
   COMPLETION FLOW
====================== */

const message = document.getElementById("message");
const question = document.getElementById("question");

function completeGame() {
  document.getElementById("grid-wrapper").style.display = "none";

  const lines = [
    "Congratulations Baby!",
    "You found all the words!",
    "Now to complete this you have one last thing to do!"
  ];

  let i = 0;
  const interval = setInterval(() => {
    message.textContent = lines[i];
    i++;
    if (i >= lines.length) {
      clearInterval(interval);
      setTimeout(() => {
        message.textContent = "";
        question.style.display = "block";
        startConfetti();
      }, 1200);
    }
  }, 1500);
}

/* ======================
   YES / NO
====================== */

document.getElementById("no").addEventListener("mouseenter", moveNo);
document.getElementById("no").addEventListener("click", moveNo);

function moveNo() {
  const btn = document.getElementById("no");
  btn.style.position = "absolute";
  btn.style.left = Math.random() * (window.innerWidth - 120) + "px";
  btn.style.top = Math.random() * (window.innerHeight - 60) + "px";
}

document.getElementById("yes").addEventListener("click", () => {
  question.style.display = "none";
  message.innerHTML = `
    AWESOME! Now you get to claim your gifts :)<br>
    Go outside!!
  `;
});

/* ======================
   CONFETTI
====================== */

const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let confetti = Array.from({ length: 150 }, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  r: Math.random() * 6 + 4,
  d: Math.random() * 5 + 2,
  color: Math.random() > 0.5 ? "#ffc0cb" : "#ffffff"
}));

function startConfetti() {
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    confetti.forEach(c => {
      ctx.beginPath();
      ctx.fillStyle = c.color;
      ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
      ctx.fill();
      c.y += c.d;
      if (c.y > canvas.height) c.y = -10;
    });
    requestAnimationFrame(draw);
  }
  draw();
}
</script>

</body>
</html>
